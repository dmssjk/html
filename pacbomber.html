<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PacBomber — Pac-Man × Bomber-Man</title>
<style>
  :root{
    --bg:#05060f; --wall:#1e3a8a; --wall2:#3b82f6; --pellet:#ffd54a;
    --pac:#ffe600; --hud:#e8ecff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(circle at 50% -10%,#12143a,#05060f 70%);
    color:var(--hud);
    font-family:"Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    min-height:100%;padding:18px 10px;
  }
  h1{
    margin:0 0 4px;font-size:clamp(22px,5vw,34px);letter-spacing:2px;
    background:linear-gradient(90deg,#ffe600,#ff5da2,#4fd1ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 24px rgba(120,120,255,.25);
  }
  .sub{margin:0 0 14px;opacity:.65;font-size:13px;letter-spacing:1px}
  .hud{
    display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
    margin-bottom:10px;font-size:15px;
  }
  .hud b{color:#ffe600}
  .stage{
    position:relative;border-radius:14px;overflow:hidden;
    box-shadow:0 0 0 3px #1b1f4d,0 18px 50px rgba(0,0,0,.6);
    background:#03040c;
  }
  canvas{display:block;image-rendering:pixelated}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;
    background:rgba(3,4,12,.86);backdrop-filter:blur(2px);gap:12px;padding:20px;
  }
  .overlay h2{margin:0;font-size:30px}
  .overlay p{margin:0;max-width:340px;line-height:1.5;opacity:.85;font-size:14px}
  .btn{
    cursor:pointer;border:none;padding:11px 26px;border-radius:30px;
    font-size:16px;font-weight:700;letter-spacing:1px;color:#0a0a1f;
    background:linear-gradient(90deg,#ffe600,#ffb020);
    box-shadow:0 6px 18px rgba(255,200,0,.35);transition:transform .1s;
  }
  .btn:active{transform:scale(.95)}
  .keys{font-size:12.5px;opacity:.75;line-height:1.7}
  .keys kbd{
    background:#20244f;border-radius:5px;padding:1px 7px;
    border-bottom:2px solid #0d0f2b;font-family:inherit;color:#dfe4ff;
  }
  .pad{
    display:none;margin-top:16px;grid-template-columns:repeat(3,64px);
    grid-template-rows:repeat(3,64px);gap:8px;
  }
  .pad button{
    border:none;border-radius:12px;background:#191d45;color:#cdd3ff;
    font-size:24px;font-weight:700;touch-action:manipulation;
  }
  .pad button:active{background:#2a3070}
  .pad .bomb{background:linear-gradient(#ff5da2,#c81e6a);color:#fff;font-size:20px}
  @media (hover:none){.pad{display:grid}}
</style>
</head>
<body>
  <h1>PAC · BOMBER</h1>
  <p class="sub">Pac-Man 🟡 encontra Bomber-Man 💣</p>

  <div class="hud">
    <span>Pontos: <b id="score">0</b></span>
    <span>Vidas: <b id="lives">3</b></span>
    <span>Bombas: <b id="bombs">1</b></span>
    <span>Nível: <b id="level">1</b></span>
  </div>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">PacBomber</h2>
      <p id="ov-text">Coma todas as bolinhas e solte bombas para explodir paredes e fantasmas. Cuidado: a explosão também te pega!</p>
      <div class="keys">
        Mover: <kbd>W A S D</kbd> / <kbd>← ↑ ↓ →</kbd><br>
        Bomba: <kbd>Espaço</kbd> · Pausar: <kbd>P</kbd>
      </div>
      <button class="btn" id="startBtn">JOGAR</button>
    </div>
  </div>

  <!-- controles touch -->
  <div class="pad" id="pad">
    <span></span><button data-dir="up">▲</button><span></span>
    <button data-dir="left">◄</button>
    <button class="bomb" data-dir="bomb">💣</button>
    <button data-dir="right">►</button>
    <span></span><button data-dir="down">▼</button><span></span>
  </div>

<script>
(() => {
  "use strict";

  // ---- Mapa: cada linha é uma string ----------------------------------
  // # parede indestrutível, = parede destrutível (bomba), . pellet,
  // o power-pellet, espaço = corredor vazio, P player, G ghost spawn
  const RAW = [
    "###################",
    "#........#........#",
    "#o##.###.#.###.##o#",
    "#.................#",
    "#.##.#.#####.#.##.#",
    "#....#...#...#....#",
    "####.### # ###.####",
    "===#.#  G G  #.#===",
    "####.# ##=## #.####",
    "    .  #GGG#  .    ",
    "####.# ##### #.####",
    "===#.#       #.#===",
    "####.# ##### #.####",
    "#........#........#",
    "#o##.###.#.###.##o#",
    "#..#.....P.....#..#",
    "##.#.#.#####.#.#.##",
    "#....#...#...#....#",
    "#.######.#.######.#",
    "#.................#",
    "###################"
  ];

  const COLS = RAW[0].length, ROWS = RAW.length;
  const TILE = 28;
  const W = COLS * TILE, H = ROWS * TILE;

  const cv = document.getElementById("game");
  const ctx = cv.getContext("2d");
  // suporte a tela cheia responsiva mantendo proporção
  function fit(){
    const maxW = Math.min(window.innerWidth - 24, 640);
    const scale = maxW / W;
    cv.width = W; cv.height = H;
    cv.style.width = (W*scale)+"px";
    cv.style.height = (H*scale)+"px";
  }
  window.addEventListener("resize", fit);

  // ---- Estado do mundo -------------------------------------------------
  const T = { EMPTY:0, WALL:1, SOFT:2, PELLET:3, POWER:4 };
  let grid, pelletsLeft, score, lives, level, bombCap;
  let player, ghosts, bombs, blasts, particles;
  let state = "menu"; // menu | playing | paused | dead | win | over
  let powerTimer = 0;

  const el = id => document.getElementById(id);
  const overlay = el("overlay");

  function buildLevel(){
    grid = [];
    ghosts = [];
    bombs = [];
    blasts = [];
    particles = [];
    pelletsLeft = 0;
    const ghostSpawns = [];
    let playerSpawn = {x:9,y:15};

    for(let y=0;y<ROWS;y++){
      const row=[];
      for(let x=0;x<COLS;x++){
        const c = RAW[y][x];
        let t = T.EMPTY;
        if(c==="#") t=T.WALL;
        else if(c==="=") t=T.SOFT;
        else if(c===".") { t=T.PELLET; pelletsLeft++; }
        else if(c==="o") { t=T.POWER; pelletsLeft++; }
        else if(c==="P"){ playerSpawn={x,y}; }
        else if(c==="G"){ ghostSpawns.push({x,y}); }
        row.push(t);
      }
      grid.push(row);
    }

    player = {
      x:playerSpawn.x, y:playerSpawn.y,
      px:playerSpawn.x, py:playerSpawn.y, // posição interpolada
      dir:{x:0,y:0}, want:{x:0,y:0},
      moving:false, mouth:0, spawn:playerSpawn
    };

    const colors = ["#ff3b3b","#ff9ce0","#54e6ff","#ffb14e","#a78bfa"];
    const count = Math.min(3 + level, ghostSpawns.length);
    for(let i=0;i<count;i++){
      const s = ghostSpawns[i % ghostSpawns.length];
      ghosts.push({
        x:s.x, y:s.y, px:s.x, py:s.y, dir:{x:0,y:-1},
        color:colors[i%colors.length], moving:false,
        scared:false, dead:false, spawn:s, respawn:0, speed:0.055+level*0.004
      });
    }
    bombCap = 1;
    el("bombs").textContent = bombCap;
  }

  function resetPositions(){
    player.x=player.spawn.x; player.y=player.spawn.y;
    player.px=player.x; player.py=player.y;
    player.dir={x:0,y:0}; player.want={x:0,y:0}; player.moving=false;
    ghosts.forEach(g=>{
      g.x=g.spawn.x; g.y=g.spawn.y; g.px=g.x; g.py=g.y;
      g.dir={x:0,y:-1}; g.moving=false; g.scared=false; g.dead=false; g.respawn=0;
    });
    bombs=[]; blasts=[];
  }

  function startGame(){
    score=0; lives=3; level=1;
    buildLevel();
    updateHUD();
    state="playing";
    overlay.style.display="none";
  }

  function nextLevel(){
    level++;
    buildLevel();
    updateHUD();
    state="playing";
    overlay.style.display="none";
  }

  function updateHUD(){
    el("score").textContent=score;
    el("lives").textContent=lives;
    el("level").textContent=level;
    el("bombs").textContent=Math.max(0,(bombCap||0)-(bombs?bombs.length:0));
  }

  function showOverlay(title,text,btn){
    el("ov-title").textContent=title;
    el("ov-text").textContent=text;
    el("startBtn").textContent=btn;
    overlay.style.display="flex";
  }

  // ---- Helpers de grade ------------------------------------------------
  const inb = (x,y)=> x>=0 && x<COLS && y>=0 && y<ROWS;
  function tileAt(x,y){
    if(!inb(x,y)) return T.WALL;
    return grid[y][x];
  }
  const isWall = (x,y)=>{ const t=tileAt(x,y); return t===T.WALL||t===T.SOFT; };
  function bombAt(x,y){ return bombs.some(b=>b.x===x&&b.y===y); }

  function canEnter(x,y, isGhost){
    if(!inb(x,y)) return false;
    if(isWall(x,y)) return false;
    return true;
  }

  // ---- Entrada ---------------------------------------------------------
  const keys={};
  function setDir(dx,dy){ player.want={x:dx,y:dy}; }
  window.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())) e.preventDefault();
    if(k==="w"||k==="arrowup") setDir(0,-1);
    else if(k==="s"||k==="arrowdown") setDir(0,1);
    else if(k==="a"||k==="arrowleft") setDir(-1,0);
    else if(k==="d"||k==="arrowright") setDir(1,0);
    else if(k===" ") dropBomb();
    else if(k==="p") togglePause();
  },{passive:false});

  document.getElementById("pad").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const d=b.dataset.dir;
    if(d==="up")setDir(0,-1); else if(d==="down")setDir(0,1);
    else if(d==="left")setDir(-1,0); else if(d==="right")setDir(1,0);
    else if(d==="bomb")dropBomb();
  });

  function togglePause(){
    if(state==="playing"){ state="paused"; showOverlay("Pausado","Respire fundo 😌","CONTINUAR"); }
    else if(state==="paused"){ state="playing"; overlay.style.display="none"; }
  }

  // ---- Bombas & explosões ---------------------------------------------
  function dropBomb(){
    if(state!=="playing") return;
    if(bombs.length>=bombCap) return;
    if(bombAt(player.x,player.y)) return;
    bombs.push({x:player.x,y:player.y,fuse:1.6,range:2});
    updateHUD();
  }

  function explode(bomb){
    const cells=[{x:bomb.x,y:bomb.y}];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dy] of dirs){
      for(let r=1;r<=bomb.range;r++){
        const nx=bomb.x+dx*r, ny=bomb.y+dy*r;
        if(!inb(nx,ny)) break;
        const t=grid[ny][nx];
        if(t===T.WALL) break;           // parede sólida bloqueia
        cells.push({x:nx,y:ny});
        if(t===T.SOFT){                 // destrói e para
          grid[ny][nx]=T.EMPTY;
          score+=20;
          spawnParticles(nx,ny,"#ff9ce0");
          // chance de virar pellet
          if(Math.random()<0.5){ grid[ny][nx]=T.PELLET; pelletsLeft++; }
          break;
        }
      }
    }
    cells.forEach(c=>{
      blasts.push({x:c.x,y:c.y,life:0.45});
      spawnParticles(c.x,c.y,"#ffd24a");
    });
    // reação em cadeia
    bombs.forEach(b=>{ if(b!==bomb && cells.some(c=>c.x===b.x&&c.y===b.y)) b.fuse=Math.min(b.fuse,0.05); });
  }

  function spawnParticles(x,y,color){
    for(let i=0;i<8;i++){
      particles.push({
        px:x+0.5, py:y+0.5,
        vx:(Math.random()-0.5)*0.12, vy:(Math.random()-0.5)*0.12,
        life:0.5, color
      });
    }
  }

  function blastAt(x,y){ return blasts.some(b=>b.x===x&&b.y===y); }

  // ---- Movimento em grade com interpolação ----------------------------
  function stepEntity(ent,speed,isGhost){
    if(ent.moving){
      // interpola px,py -> x,y
      const dx=ent.x-ent.px, dy=ent.y-ent.py;
      const step=speed;
      if(Math.hypot(dx,dy)<=step){ ent.px=ent.x; ent.py=ent.y; ent.moving=false; }
      else{ const a=Math.atan2(dy,dx); ent.px+=Math.cos(a)*step; ent.py+=Math.sin(a)*step; }
    }
    return !ent.moving; // pronto para nova decisão
  }

  function tryTurn(ent,dir,isGhost){
    const nx=ent.x+dir.x, ny=ent.y+dir.y;
    if(canEnter(nx,ny,isGhost) && !(isGhost && bombAt(nx,ny))){
      ent.x=nx; ent.y=ny; ent.dir={...dir}; ent.moving=true; return true;
    }
    return false;
  }

  function updatePlayer(dt){
    if(stepEntity(player,0.14,false)){
      // no centro de um tile: tenta virar para direção desejada
      if((player.want.x||player.want.y) && tryTurn(player,player.want,false)){
        // ok
      } else {
        tryTurn(player,player.dir,false); // segue reto
      }
      // comer
      const t=grid[player.y][player.x];
      if(t===T.PELLET){ grid[player.y][player.x]=T.EMPTY; score+=10; pelletsLeft--; }
      else if(t===T.POWER){ grid[player.y][player.x]=T.EMPTY; score+=50; pelletsLeft--;
        powerTimer=7; ghosts.forEach(g=>{ if(!g.dead) g.scared=true; }); }
    }
    if(player.moving||player.dir.x||player.dir.y) player.mouth+=dt*10;
  }

  function ghostAI(g){
    // decide direção no centro de um tile
    const opts=[];
    const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    for(const d of dirs){
      const nx=g.x+d.x, ny=g.y+d.y;
      // não volta de ré a menos que sem saída
      if(d.x===-g.dir.x && d.y===-g.dir.y) continue;
      if(canEnter(nx,ny,true) && !bombAt(nx,ny)) opts.push(d);
    }
    let choice;
    if(opts.length===0){
      // permite recuar
      const back={x:-g.dir.x,y:-g.dir.y};
      choice = canEnter(g.x+back.x,g.y+back.y,true) ? back : {x:0,y:0};
    } else {
      // alvo: fugir se assustado, senão caçar o player
      const target = (g.scared||g.dead) ? {x:g.dead?g.spawn.x:player.spawn.x - (player.x-g.spawn.x), y:g.spawn.y} : player;
      let best=opts[0], bestD=Infinity;
      for(const d of opts){
        const nx=g.x+d.x, ny=g.y+d.y;
        let dist=Math.hypot(nx-(g.dead?g.spawn.x:target.x), ny-(g.dead?g.spawn.y:target.y));
        if(g.scared&&!g.dead) dist=-dist; // maximiza distância
        // evita bombas prestes a explodir
        if(bombs.some(b=>Math.abs(b.x-nx)+Math.abs(b.y-ny)<=2 && b.fuse<0.6)) dist+=50;
        if(dist<bestD){bestD=dist;best=d;}
      }
      // pitada de aleatoriedade
      choice = (Math.random()<0.15)? opts[(Math.random()*opts.length)|0] : best;
    }
    if(choice.x||choice.y){ tryTurn(g,choice,true); }
  }

  function updateGhost(g,dt){
    if(g.dead){
      if(stepEntity(g,0.16,true)){
        if(g.x===g.spawn.x&&g.y===g.spawn.y){ g.dead=false; g.scared=false; }
        else ghostAI(g);
      }
      return;
    }
    const spd = g.scared ? g.speed*0.6 : g.speed*(1.9);
    if(stepEntity(g,spd,true)) ghostAI(g);
  }

  // ---- Colisões --------------------------------------------------------
  function entityOverlap(a,b){
    return Math.abs(a.px-b.px)<0.6 && Math.abs(a.py-b.py)<0.6;
  }

  function checkCollisions(){
    // player vs blast
    if(blastAt(Math.round(player.px),Math.round(player.py)) || blastAt(player.x,player.y)){
      // checa também pela posição interpolada
      if(blasts.some(bl=>Math.abs(bl.x-player.px)<0.6&&Math.abs(bl.y-player.py)<0.6)){
        loseLife("BOOM! A explosão te pegou 💥"); return;
      }
    }
    for(const g of ghosts){
      if(g.dead) continue;
      // ghost pego por blast
      if(blasts.some(bl=>Math.abs(bl.x-g.px)<0.6&&Math.abs(bl.y-g.py)<0.6)){
        g.dead=true; g.scared=false; score+=200; spawnParticles(g.x,g.y,g.color); continue;
      }
      if(entityOverlap(player,g)){
        if(g.scared){ g.dead=true; g.scared=false; score+=200; spawnParticles(g.x,g.y,g.color); }
        else { loseLife("Um fantasma te pegou 👻"); return; }
      }
    }
  }

  function loseLife(msg){
    lives--;
    updateHUD();
    if(lives<=0){
      state="over";
      showOverlay("Fim de Jogo","Pontuação final: "+score+". "+msg,"JOGAR DE NOVO");
    } else {
      state="respawn";
      showOverlay("Ai! "+msg, "Vidas restantes: "+lives,"CONTINUAR");
    }
  }

  // ---- Loop ------------------------------------------------------------
  let last=0;
  function loop(ts){
    const dt=Math.min(0.05,(ts-last)/1000)||0; last=ts;
    if(state==="playing"){
      update(dt);
    }
    render();
    requestAnimationFrame(loop);
  }

  function update(dt){
    updatePlayer(dt);
    ghosts.forEach(g=>updateGhost(g,dt));

    // power timer
    if(powerTimer>0){ powerTimer-=dt; if(powerTimer<=0){ ghosts.forEach(g=>g.scared=false); } }

    // bombas
    for(let i=bombs.length-1;i>=0;i--){
      const b=bombs[i]; b.fuse-=dt;
      if(b.fuse<=0){ explode(b); bombs.splice(i,1); updateHUD(); }
    }
    // blasts
    for(let i=blasts.length-1;i>=0;i--){ blasts[i].life-=dt; if(blasts[i].life<=0) blasts.splice(i,1); }
    // partículas
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i]; p.px+=p.vx; p.py+=p.vy; p.life-=dt;
      if(p.life<=0) particles.splice(i,1);
    }

    checkCollisions();

    if(pelletsLeft<=0 && state==="playing"){
      state="win";
      showOverlay("Nível "+level+" limpo! 🎉","Pontos: "+score,"PRÓXIMO NÍVEL");
    }
  }

  // ---- Render ----------------------------------------------------------
  function render(){
    ctx.clearRect(0,0,W,H);
    if(!grid) return;
    // fundo
    ctx.fillStyle="#03040c"; ctx.fillRect(0,0,W,H);

    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        const t=grid[y][x];
        const cx=x*TILE, cy=y*TILE;
        if(t===T.WALL){
          const g=ctx.createLinearGradient(cx,cy,cx,cy+TILE);
          g.addColorStop(0,"#2b46b8"); g.addColorStop(1,"#152a7a");
          ctx.fillStyle=g;
          roundRect(cx+2,cy+2,TILE-4,TILE-4,6); ctx.fill();
          ctx.strokeStyle="rgba(120,160,255,.4)"; ctx.lineWidth=1;
          roundRect(cx+2,cy+2,TILE-4,TILE-4,6); ctx.stroke();
        } else if(t===T.SOFT){
          ctx.fillStyle="#6b4a2a";
          roundRect(cx+3,cy+3,TILE-6,TILE-6,4); ctx.fill();
          ctx.strokeStyle="rgba(255,200,150,.35)";
          ctx.beginPath();
          ctx.moveTo(cx+TILE/2,cy+3); ctx.lineTo(cx+TILE/2,cy+TILE-3);
          ctx.moveTo(cx+3,cy+TILE/2); ctx.lineTo(cx+TILE-3,cy+TILE/2);
          ctx.stroke();
        } else if(t===T.PELLET){
          ctx.fillStyle="#ffd54a";
          ctx.beginPath(); ctx.arc(cx+TILE/2,cy+TILE/2,3,0,7); ctx.fill();
        } else if(t===T.POWER){
          const pulse=2+Math.sin(performance.now()/200)*1.5;
          ctx.fillStyle="#ffe600";
          ctx.shadowColor="#ffe600"; ctx.shadowBlur=12;
          ctx.beginPath(); ctx.arc(cx+TILE/2,cy+TILE/2,5+pulse,0,7); ctx.fill();
          ctx.shadowBlur=0;
        }
      }
    }

    // bombas
    bombs.forEach(b=>{
      const cx=b.x*TILE+TILE/2, cy=b.y*TILE+TILE/2;
      const s=1+Math.sin(performance.now()/90)*0.08*(1.7-b.fuse);
      ctx.fillStyle="#111";
      ctx.beginPath(); ctx.arc(cx,cy,TILE*0.36*s,0,7); ctx.fill();
      ctx.fillStyle=b.fuse<0.6?"#ff3b3b":"#444";
      ctx.beginPath(); ctx.arc(cx-4,cy-4,3,0,7); ctx.fill();
      ctx.strokeStyle="#ffb14e"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(cx+TILE*0.28,cy-TILE*0.28);
      ctx.quadraticCurveTo(cx+TILE*0.44,cy-TILE*0.44,cx+TILE*0.4,cy-TILE*0.5); ctx.stroke();
    });

    // explosões
    blasts.forEach(b=>{
      const cx=b.x*TILE, cy=b.y*TILE;
      const a=Math.max(0,b.life/0.45);
      ctx.fillStyle=`rgba(255,${120+Math.random()*80|0},40,${a})`;
      roundRect(cx+2,cy+2,TILE-4,TILE-4,6); ctx.fill();
      ctx.fillStyle=`rgba(255,240,150,${a*0.8})`;
      ctx.beginPath(); ctx.arc(cx+TILE/2,cy+TILE/2,TILE*0.3*a,0,7); ctx.fill();
    });

    // partículas
    particles.forEach(p=>{
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.fillRect(p.px*TILE-2,p.py*TILE-2,4,4);
    });
    ctx.globalAlpha=1;

    // fantasmas
    ghosts.forEach(g=>drawGhost(g));

    // player
    drawPac();
  }

  function drawPac(){
    const cx=player.px*TILE+TILE/2, cy=player.py*TILE+TILE/2, r=TILE*0.42;
    let ang=0;
    if(player.dir.x===1)ang=0; else if(player.dir.x===-1)ang=Math.PI;
    else if(player.dir.y===1)ang=Math.PI/2; else if(player.dir.y===-1)ang=-Math.PI/2;
    const open=Math.abs(Math.sin(player.mouth))*0.32+ (player.dir.x||player.dir.y?0.05:0.25);
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
    ctx.fillStyle=powerTimer>0?"#fff36b":"#ffe600";
    ctx.shadowColor="#ffe600"; ctx.shadowBlur=powerTimer>0?18:8;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r,open*Math.PI,(2-open)*Math.PI);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    // olho
    ctx.fillStyle="#222"; ctx.beginPath(); ctx.arc(2,-r*0.45,2.4,0,7); ctx.fill();
    ctx.restore();
  }

  function drawGhost(g){
    const cx=g.px*TILE+TILE/2, cy=g.py*TILE+TILE/2, r=TILE*0.42;
    let body = g.color;
    if(g.dead) body="rgba(180,200,255,.35)";
    else if(g.scared) body= (powerTimer<2 && Math.floor(performance.now()/200)%2)? "#fff":"#2453ff";
    ctx.fillStyle=body;
    ctx.beginPath();
    ctx.arc(cx,cy-2,r,Math.PI,0);
    ctx.lineTo(cx+r,cy+r-2);
    const feet=4;
    for(let i=0;i<feet;i++){
      const fx=cx+r-(2*r/feet)*(i+0.5);
      ctx.lineTo(fx, cy+r-6);
      ctx.lineTo(cx+r-(2*r/feet)*(i+1), cy+r-2);
    }
    ctx.closePath(); ctx.fill();
    // olhos
    if(!g.scared||g.dead){
      const look={x:g.dir.x,y:g.dir.y};
      for(const s of [-1,1]){
        ctx.fillStyle="#fff";
        ctx.beginPath(); ctx.ellipse(cx+s*5,cy-3,3.3,4.2,0,0,7); ctx.fill();
        ctx.fillStyle="#1030c0";
        ctx.beginPath(); ctx.arc(cx+s*5+look.x*2,cy-3+look.y*2,1.9,0,7); ctx.fill();
      }
    } else {
      ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(cx-4,cy-3,1.6,0,7); ctx.arc(cx+4,cy-3,1.6,0,7); ctx.fill();
      ctx.strokeStyle="#fff"; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(cx-6,cy+5);
      for(let i=0;i<4;i++){ ctx.lineTo(cx-6+i*3+1.5,cy+2); ctx.lineTo(cx-6+(i+1)*3,cy+5); }
      ctx.stroke();
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // ---- Botão / fluxo ---------------------------------------------------
  el("startBtn").addEventListener("click",()=>{
    if(state==="menu"||state==="over") startGame();
    else if(state==="win") nextLevel();
    else if(state==="respawn"){ resetPositions(); state="playing"; overlay.style.display="none"; }
    else if(state==="paused"){ state="playing"; overlay.style.display="none"; }
  });

  // init
  fit();
  updateHUD();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
